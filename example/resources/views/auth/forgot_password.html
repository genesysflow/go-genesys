<!-- Forgot password -->
<form method="POST" action="/forgot-password">
  {{csrf_field .csrf_token}}

  {{if .session}}{{with .session.GetString "status"}}<p class="status">{{.}}</p>{{end}}{{end}}

  <p>Tell us your address and we will send you a reset link.</p>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{.old.Get "email"}}" required>
  {{if .errors.Has "email"}}<span class="error">{{.errors.First "email"}}</span>{{end}}

  <button type="submit">Email reset link</button>
</form>
