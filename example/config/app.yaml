name: ${APP_NAME:-Genesys}
env: ${APP_ENV:-local}
# Off unless asked for: debug puts the underlying error and a stack
# trace in the response body. .env turns it on for local development.
debug: ${APP_DEBUG:-false}
url: ${APP_URL:-http://localhost:3000}

# Signs encrypted values, signed URLs and CSRF tokens. Generate one with
# `genesys key:generate`; without it CSRF protection stays off.
key: ${APP_KEY}

timezone: UTC

